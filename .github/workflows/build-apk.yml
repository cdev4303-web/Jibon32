name: Build Jibon Tailor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App Version Name (e.g., 1.0.1)'
        required: false
        default: '1.0.0'
      version_code:
        description: 'App Version Code (number, leave blank for auto-increment)'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔢 Calculate Version Code and Version Name
        id: versioning
        run: |
          INPUT_CODE="${{ github.event.inputs.version_code }}"
          INPUT_NAME="${{ github.event.inputs.version_name }}"

          if [ -n "$INPUT_CODE" ]; then
            V_CODE="$INPUT_CODE"
          else
            # Base 100 + run_number ensures versionCode is always >= 101 and strictly increments on every build
            V_CODE=$((100 + github.run_number))
          fi

          if [ -n "$INPUT_NAME" ]; then
            V_NAME="$INPUT_NAME"
          else
            V_NAME="1.0.0"
          fi

          echo "CALCULATED_VERSION_CODE=$V_CODE" >> $GITHUB_ENV
          echo "CALCULATED_VERSION_NAME=$V_NAME" >> $GITHUB_ENV
          echo "Version Code: $V_CODE"
          echo "Version Name: $V_NAME"

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Web Dependencies
        run: npm install --no-audit

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 🔄 Sync Web Assets to Android Project
        run: |
          mkdir -p jibon/android-studio-project/app/src/main/assets/web
          rm -rf jibon/android-studio-project/app/src/main/assets/web/*
          cp -r dist/* jibon/android-studio-project/app/src/main/assets/web/
          echo "Web assets synced successfully."

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 🔐 Prepare Release Keystore
        id: prepare-keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Custom release keystore secret detected. Decoding from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release.keystore"
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Permanent repository release keystore used. Setting up fixed signing key..."
            if [ -f "${{ github.workspace }}/jibon/android-studio-project/app/jibon-release.keystore" ]; then
              cp "${{ github.workspace }}/jibon/android-studio-project/app/jibon-release.keystore" "${{ github.workspace }}/release.keystore"
            else
              echo "" | base64 --decode > "${{ github.workspace }}/release.keystore"
            fi
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=jibontailor1234" >> $GITHUB_ENV
            echo "KEY_ALIAS=jibonkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=jibontailor1234" >> $GITHUB_ENV
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: 🔨 Build Signed Release Android APK with Gradle
        working-directory: jibon/android-studio-project
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ env.CALCULATED_VERSION_CODE }}
          APP_VERSION_NAME: ${{ env.CALCULATED_VERSION_NAME }}
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          chmod +x gradlew || true
          gradle assembleRelease --stacktrace

      - name: 🧹 Secure Cleanup Keystore File
        if: always()
        run: |
          rm -f "${{ github.workspace }}/release.keystore"
          rm -f jibon/android-studio-project/local.properties

      - name: 📂 Prepare APK Files for Download
        run: |
          mkdir -p final-apks
          # Find generated release APK
          RELEASE_APK=$(find jibon/android-studio-project/app/build/outputs/apk -name "*release*.apk" -type f | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "final-apks/Jibon-Tailor-v${CALCULATED_VERSION_NAME}-build${CALCULATED_VERSION_CODE}-release.apk"
            cp "$RELEASE_APK" "final-apks/Jibon-Tailor-release-latest.apk"
          fi
          # Also copy any other generated apks
          find jibon/android-studio-project/app/build/outputs/apk -name "*.apk" -type f -exec cp -u {} final-apks/ \;
          echo "Generated APKs in final-apks/:"
          ls -lh final-apks/

      - name: 🚀 Upload APK Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Jibon-Tailor-Android-Release-APK
          path: final-apks/*.apk
          retention-days: 30

      - name: 🏷️ Publish APK to GitHub Release (If tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: final-apks/*.apk
          name: Jibon Tailor Mobile App ${{ github.ref_name }} (v${{ env.CALCULATED_VERSION_NAME }})
          body: |
            ## 📱 Jibon Tailor Android Application Release APK
            **Version:** `${{ env.CALCULATED_VERSION_NAME }}` (VersionCode: `${{ env.CALCULATED_VERSION_CODE }}`)
            **Application ID:** `com.jibontailor.app`

            Install or Update:
            - **`Jibon-Tailor-v${{ env.CALCULATED_VERSION_NAME }}-build${{ env.CALCULATED_VERSION_CODE }}-release.apk`**
            - **`Jibon-Tailor-release-latest.apk`**

            *Note: Signed with permanent Release Keystore. App data (WebView, LocalStorage, IndexedDB) will be preserved on update.*
