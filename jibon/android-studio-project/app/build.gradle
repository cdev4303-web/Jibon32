plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jibontailor.app'
    compileSdk 34

    def computedVersionCode = 1
    if (project.hasProperty('appVersionCode')) {
        computedVersionCode = Integer.parseInt(project.property('appVersionCode').toString())
    } else if (System.getenv('APP_VERSION_CODE')) {
        try {
            computedVersionCode = Integer.parseInt(System.getenv('APP_VERSION_CODE'))
        } catch (Exception ignored) {
            computedVersionCode = 1
        }
    }

    def computedVersionName = "1.0.0"
    if (project.hasProperty('appVersionName')) {
        computedVersionName = project.property('appVersionName').toString()
    } else if (System.getenv('APP_VERSION_NAME')) {
        computedVersionName = System.getenv('APP_VERSION_NAME')
    }

    defaultConfig {
        applicationId "com.jibontailor.app"
        minSdk 21
        targetSdk 34
        versionCode computedVersionCode
        versionName computedVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            // Default Android debug signing
        }
        release {
            def keystorePath = System.getenv("KEYSTORE_FILE") ?: (project.hasProperty('RELEASE_STORE_FILE') ? project.property('RELEASE_STORE_FILE') : null)
            def storePass = System.getenv("KEYSTORE_PASSWORD") ?: (project.hasProperty('RELEASE_STORE_PASSWORD') ? project.property('RELEASE_STORE_PASSWORD') : null)
            def keyId = System.getenv("KEY_ALIAS") ?: (project.hasProperty('RELEASE_KEY_ALIAS') ? project.property('RELEASE_KEY_ALIAS') : null)
            def keyPass = System.getenv("KEY_PASSWORD") ?: (project.hasProperty('RELEASE_KEY_PASSWORD') ? project.property('RELEASE_KEY_PASSWORD') : null)

            if (keystorePath && file(keystorePath).exists() && storePass && keyId && keyPass) {
                storeFile file(keystorePath)
                storePassword storePass
                keyAlias keyId
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            def releaseSigning = signingConfigs.findByName("release")
            if (releaseSigning?.storeFile && releaseSigning.storeFile.exists()) {
                signingConfig releaseSigning
            } else {
                // Fallback for local build without release keystore
                signingConfig signingConfigs.debug
            }
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
}
